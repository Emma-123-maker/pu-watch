name: Build PU-Watch
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Build PWA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release --pwa-strategy offline-first --base-href "/pu-watch/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/build/web

  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: FIX GRADLE + BUILD APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=pu_watch
          flutter pub get
          flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: pu-watch-apk-2027
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-web
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
