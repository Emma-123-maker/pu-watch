name: Build PU-Watch
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.5'
          cache: true
      - name: Build PWA 2027
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f web/index.html ]; then
            flutter create --platforms=web --project-name=pu_watch --org com.puwatch.app .
          fi
          flutter config --enable-web
          flutter pub get
          flutter build web --release --pwa-strategy offline-first --base-href "/pu-watch/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/build/web

  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.5'
          cache: true
      - name: FIX GRADLE + BUILD APK 2027 + GPS PERMISSIONS
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=pu_watch --org com.puwatch.app .
          fi
          echo "Adding GPS permissions to AndroidManifest.xml"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
            fi
            cat "$MANIFEST"
          fi
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pu-watch-apk-2027
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-web
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
