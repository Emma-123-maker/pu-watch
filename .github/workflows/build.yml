name: Build PU-Watch
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'
      - name: Build PWA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter config --enable-web
          flutter pub get
          if [ ! -f "web/index.html" ]; then
            flutter create --project-name pu_watch --platforms web .
          fi
          cat > web/manifest.json <<'JSON'
          {
            "name": "Find Your PU - INEC Polling Units",
            "short_name": "Find PU",
            "start_url": "/pu-watch/",
            "display": "standalone",
            "background_color": "#2E7D32",
            "theme_color": "#2E7D32",
            "description": "Quickly find your INEC Polling Unit",
            "orientation": "portrait-primary",
            "icons": [
              { "src": "icons/Icon-192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "icons/Icon-512.png", "sizes": "512x512", "type": "image/png" },
              { "src": "icons/Icon-maskable-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable" },
              { "src": "icons/Icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          JSON
          flutter build web --release --pwa-strategy offline-first --base-href "/pu-watch/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
