name: Build PU-Watch

on:
  push:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Fix missing Flutter files
        run: |
          cd pu-watch
          flutter config --enable-web
          flutter create . --platforms=web --project-name pu_watch
      
      - name: Install dependencies
        run: |
          cd pu-watch
          flutter pub get
      
      - name: Build Web
        run: |
          cd pu-watch
          flutter build web --release --base-href /pu-watch/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pu-watch/build/web

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Fix missing Android files
        run: |
          cd pu-watch
          flutter create . --platforms=android --project-name pu_watch
      
      - name: Install dependencies
        run: |
          cd pu-watch
          flutter pub get
      
      - name: Build APK
        run: |
          cd pu-watch
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pu-watch-apk
          path: pu-watch/build/app/outputs/flutter-apk/app-release.apk
