name: Build PU-Watch
permissions:
  contents: write
on:
  push:
    branches: [ main ]
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
      - name: Prepare assets
        run: |
          mkdir -p pu-watch/assets/data
          cp assets/data/pu_sample.json pu-watch/assets/data/ || true
      - name: Build Web
        run: |
          cd pu-watch
          flutter config --enable-web
          flutter create . --platforms=web --project-name pu_watch
          flutter pub get
          flutter build web --release --base-href /pu-watch/
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pu-watch/build/web

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          java-version: '17'
      - name: Prepare assets
        run: |
          mkdir -p pu-watch/assets/data
          cp assets/data/pu_sample.json pu-watch/assets/data/ || true
      - name: Recreate Android
        run: |
          cd pu-watch
          rm -rf android
          flutter create . --platforms=android --project-name pu_watch
      - name: Upgrade deps
        run: |
          cd pu-watch
          flutter pub upgrade
      - name: Build APK
        run: |
          cd pu-watch
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pu-watch-apk
          path: pu-watch/build/app/outputs/flutter-apk/app-release.apk
