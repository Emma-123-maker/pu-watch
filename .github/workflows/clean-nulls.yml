name: Clean Null PUs
on:
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Find and clean
        run: |
          echo "=== FINDING ALL JSON ==="
          find. -name "*.json" -type f | head -n 100
          echo "=== CLEANING ==="
          python3 << 'PY'
          import json, glob, os
          for path in glob.glob("**/*.json", recursive=True):
            if ".git" in path: continue
            try:
              with open(path, 'r', encoding='utf-8') as f:
                txt = f.read()
              if "null - PU" not in txt.lower():
                continue
              print(f"FOUND null in: {path}")
              data = json.loads(txt)
              def is_null_item(x):
                s = str(x).lower()
                return "null - pu" in s or s.strip() == "null"

              if isinstance(data, list):
                new_data = [i for i in data if not is_null_item(i) and "null - pu" not in str(i).lower()]
                if len(new_data)!= len(data):
                  print(f" {path}: {len(data)} -> {len(new_data)}")
                  open(path,'w').write(json.dumps(new_data))
              elif isinstance(data, dict):
                for k in list(data.keys()):
                  if isinstance(data[k], list):
                    before=len(data[k])
                    data[k]=[i for i in data[k] if "null - pu" not in str(i).lower()]
                    if len(data[k])!=before:
                      print(f" {path}[{k}]: {before}->{len(data[k])}")
                      open(path,'w').write(json.dumps(data))
            except Exception as e:
              print(f"Error {path}: {e}")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "V3 final null kill" || echo "no change"
          git push
