name: Clean Null PUs
on:
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deep clean nulls EVERYWHERE
        run: |
          python3 << 'PY'
          import glob
          print("=== SEARCHING ALL FILES FOR null - PU ===")
          cleaned=0
          for path in glob.glob("**/*", recursive=True):
            if ".git/" in path: continue
            if not path.endswith((".dart",".json",".js",".ts")): continue
            try:
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                text = f.read()
              if "null - pu" in text.lower():
                print(f"FOUND in: {path}")
                # remove lines containing null - pu
                lines = text.splitlines()
                new_lines = [l for l in lines if "null - pu" not in l.lower()]
                if len(new_lines) < len(lines):
                  print(f"  CLEAN {path}: {len(lines)} -> {len(new_lines)} lines")
                  open(path,'w',encoding='utf-8').write("\n".join(new_lines))
                  cleaned+=1
            except: pass
          print(f"=== DONE cleaned {cleaned} files ===")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "V5 clean ALL file types" || echo "nothing"
          git push
