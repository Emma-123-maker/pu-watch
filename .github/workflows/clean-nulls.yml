name: Clean Null PUs
on:
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deep clean nulls with Python
        run: |
          python3 << 'PY'
          import json, os, glob
          paths = glob.glob("**/*.json", recursive=True)
          cleaned = 0
          for p in paths:
            if ".github" in p or "node_modules" in p:
              continue
            try:
              with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                data = json.load(f)
              orig_len = len(data) if isinstance(data, list) else 0
              # Case 1: list of PUs
              if isinstance(data, list):
                new_data = []
                for item in data:
                  s = str(item).lower()
                  if "null - pu" in s: continue
                  if isinstance(item, dict):
                    code = str(item.get("code","") or item.get("PU","") or item.get("pu_code","") or item.get("name",""))
                    if code.strip().lower() in ["null", "null - pu", ""]:
                      continue
                    # check pu_name fields
                    pu_name = str(item.get("pu_name","") or item.get("name","") or item.get("PU_NAME",""))
                    if "null" == pu_name.strip().lower() or "null - pu" in pu_name.lower():
                      continue
                  new_data.append(item)
                if len(new_data)!= orig_len:
                  print(f"{p}: {orig_len} -> {len(new_data)}")
                  with open(p, 'w') as out:
                    json.dump(new_data, out)
                  cleaned += 1
              # Case 2: dict with data/pus key
              elif isinstance(data, dict):
                for key in ["pus","data","PUs","polling_units"]:
                  if key in data and isinstance(data[key], list):
                    before = len(data[key])
                    data[key] = [x for x in data[key] if "null - pu" not in str(x).lower()]
                    after = len(data[key])
                    if before!= after:
                      print(f"{p}[{key}]: {before}->{after}")
                      with open(p, 'w') as out:
                        json.dump(data, out)
                      cleaned+=1
            except Exception as e:
              print(f"skip {p}: {e}")
          print(f"Done cleaned {cleaned} files")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deep clean null PU V2" || echo "no diff"
          git push
