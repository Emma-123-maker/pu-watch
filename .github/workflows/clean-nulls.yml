name: Clean Null PUs
on:
  workflow_dispatch:
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean ALL states
        run: |
          python3 << 'PY'
          import json, glob
          files = glob.glob("**/assets/data/states/*.json", recursive=True)
          print(f"Found {len(files)} state files")
          total_removed = 0
          for path in files:
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
                  if not isinstance(data, list): continue
                  orig = len(data)
                  # keep only valid PUs
                  cleaned = []
                  for item in data:
                      if not isinstance(item, dict): continue
                      # check common keys
                      name = str(item.get('pu_name') or item.get('name') or item.get('polling_unit') or '').strip()
                      code = str(item.get('pu_code') or item.get('code') or '').strip()
                      if not name: continue
                      if name.lower() == 'null': continue
                      if 'null - pu' in name.lower(): continue
                      if not code: continue
                      if code.lower() == 'null': continue
                      cleaned.append(item)
                  removed = orig - len(cleaned)
                  if removed > 0:
                      print(f"{path}: {orig} -> {len(cleaned)} (-{removed})")
                      total_removed += removed
                      with open(path, 'w', encoding='utf-8') as f:
                          json.dump(cleaned, f, indent=2, ensure_ascii=False)
              except Exception as e:
                  print(f"Skip {path}: {e}")
          print(f"TOTAL REMOVED: {total_removed} null PUs from all states!")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "V7 clean ALL states null PUs" || echo "nothing"
          git push
