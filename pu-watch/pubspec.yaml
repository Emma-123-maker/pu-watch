name: pu_watch
description: Every PU becomes a live broadcaster for transparent elections.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^11.0.0
  url_launcher: ^6.2.0
  cupertino_icons: ^1.0.5
  # --- OFFLINE MODE ---
  connectivity_plus: ^6.0.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/data/pu_sample.json
    - assets/data/states_index.json
    - assets/data/states/
