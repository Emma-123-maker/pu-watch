name: pu_watch
description: Every PU becomes a live broadcaster for transparent elections.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^11.0.0
  url_launcher: ^6.2.0
  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/pu_sample.json
    - assets/data/states_index.json
    - assets/data/states/
